cd ~/practica-vm-web
cat > .github/workflows/deploy.yml << 'EOF'
name: CI-CD Practica VM
on:
  push:
    branches: [ main ]
jobs:
  test:
    name: Verificar contenido
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Verificar que existe el HTML
        run: test -f index.html
      - name: Verificar contenido esperado
        run: grep -q "<html" index.html
  deploy:
    name: Desplegar en la VM
    needs: test
    runs-on: self-hosted
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Copiar a nginx
        run: sudo /usr/bin/cp index.html /var/www/html/index.html
      - name: Reiniciar nginx
        run: sudo /usr/bin/systemctl restart nginx
EOF
